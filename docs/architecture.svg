<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Merlin LINE AI News Bot architecture</title>
  <desc id="desc">Architecture diagram showing the scheduled content generation flow and the LINE webhook query flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 38px "Segoe UI", "Noto Sans TC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px "Segoe UI", "Noto Sans TC", sans-serif; fill: #475569; }
      .lane-title { font: 700 23px "Segoe UI", "Noto Sans TC", sans-serif; }
      .box-title { font: 700 20px "Segoe UI", "Noto Sans TC", sans-serif; fill: #0f172a; }
      .box-text { font: 400 16px "Segoe UI", "Noto Sans TC", sans-serif; fill: #475569; }
      .small { font: 600 14px "Segoe UI", "Noto Sans TC", sans-serif; fill: #64748b; letter-spacing: .4px; }
      .flow-label { font: 600 14px "Segoe UI", "Noto Sans TC", sans-serif; }
      .box { fill: #fff; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .green-line { fill: none; stroke: #059669; stroke-width: 4; marker-end: url(#arrow-green); }
      .shared-line { fill: none; stroke: #7c3aed; stroke-width: 4; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#bg)"/>
  <text x="80" y="70" class="title">Merlin LINE AI News Bot</text>
  <text x="80" y="105" class="subtitle">模組化單體 · 分層架構 · Azure Functions</text>

  <!-- Composition root -->
  <rect x="490" y="135" width="620" height="105" class="box" stroke="#7c3aed"/>
  <text x="800" y="174" text-anchor="middle" class="small">COMPOSITION ROOT</text>
  <text x="800" y="207" text-anchor="middle" class="box-title">function_app.py</text>
  <text x="800" y="230" text-anchor="middle" class="box-text">建立 dependencies · 註冊 HTTP callback 與 Timer trigger</text>

  <!-- Lane backgrounds -->
  <rect x="55" y="285" width="730" height="680" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="815" y="285" width="730" height="680" rx="28" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="90" y="330" class="lane-title" fill="#1d4ed8">① 排程內容產生流程</text>
  <text x="850" y="330" class="lane-title" fill="#047857">② LINE 即時查詢流程</text>

  <!-- Scheduled lane -->
  <rect x="90" y="365" width="260" height="95" class="box" stroke="#60a5fa"/>
  <text x="220" y="402" text-anchor="middle" class="box-title">Azure Timer</text>
  <text x="220" y="430" text-anchor="middle" class="box-text">每 6 小時觸發</text>

  <rect x="455" y="365" width="280" height="95" class="box" stroke="#60a5fa"/>
  <text x="595" y="400" text-anchor="middle" class="box-title">DailyContentJob</text>
  <text x="595" y="428" text-anchor="middle" class="box-text">jobs.py · 協調工作流程</text>

  <path d="M350 412 H455" class="blue-line"/>

  <rect x="90" y="535" width="260" height="105" class="box" stroke="#60a5fa"/>
  <text x="220" y="573" text-anchor="middle" class="box-title">feeds.py</text>
  <text x="220" y="601" text-anchor="middle" class="box-text">下載、清理、去重 RSS</text>
  <text x="220" y="624" text-anchor="middle" class="small">RSS ADAPTER</text>

  <rect x="455" y="535" width="280" height="105" class="box" stroke="#60a5fa"/>
  <text x="595" y="573" text-anchor="middle" class="box-title">ContentGenerator</text>
  <text x="595" y="601" text-anchor="middle" class="box-text">generation.py · Structured Output</text>
  <text x="595" y="624" text-anchor="middle" class="small">AI SERVICE</text>

  <path d="M560 460 C500 490 330 485 260 535" class="blue-line"/>
  <path d="M625 460 V535" class="blue-line"/>

  <rect x="90" y="715" width="260" height="100" class="box" stroke="#94a3b8"/>
  <text x="220" y="753" text-anchor="middle" class="box-title">外部 RSS Sources</text>
  <text x="220" y="781" text-anchor="middle" class="box-text">AI 與資安新聞來源</text>

  <rect x="455" y="715" width="280" height="100" class="box" stroke="#94a3b8"/>
  <text x="595" y="753" text-anchor="middle" class="box-title">Azure OpenAI</text>
  <text x="595" y="781" text-anchor="middle" class="box-text">摘要與職場英文生成</text>

  <path d="M220 640 V715" class="blue-line"/>
  <path d="M595 640 V715" class="blue-line"/>
  <text x="235" y="686" class="flow-label" fill="#2563eb">讀取</text>
  <text x="610" y="686" class="flow-label" fill="#2563eb">呼叫</text>

  <!-- LINE lane -->
  <rect x="850" y="365" width="250" height="95" class="box" stroke="#34d399"/>
  <text x="975" y="402" text-anchor="middle" class="box-title">LINE 使用者</text>
  <text x="975" y="430" text-anchor="middle" class="box-text">傳送文字指令</text>

  <rect x="1215" y="365" width="280" height="95" class="box" stroke="#34d399"/>
  <text x="1355" y="400" text-anchor="middle" class="box-title">HTTP Callback</text>
  <text x="1355" y="428" text-anchor="middle" class="box-text">驗證 LINE signature</text>

  <path d="M1100 412 H1215" class="green-line"/>

  <rect x="850" y="535" width="280" height="105" class="box" stroke="#34d399"/>
  <text x="990" y="573" text-anchor="middle" class="box-title">LineBotService</text>
  <text x="990" y="601" text-anchor="middle" class="box-text">line_service.py · 指令路由</text>
  <text x="990" y="624" text-anchor="middle" class="small">APPLICATION SERVICE</text>

  <rect x="1215" y="535" width="280" height="105" class="box" stroke="#34d399"/>
  <text x="1355" y="573" text-anchor="middle" class="box-title">news_views.py</text>
  <text x="1355" y="601" text-anchor="middle" class="box-text">建立 LINE Flex Message</text>
  <text x="1355" y="624" text-anchor="middle" class="small">PRESENTATION</text>

  <path d="M1355 460 C1340 495 1100 490 1030 535" class="green-line"/>
  <path d="M1130 587 H1215" class="green-line"/>

  <rect x="1035" y="715" width="300" height="100" class="box" stroke="#a78bfa"/>
  <text x="1185" y="753" text-anchor="middle" class="box-title">BlobJsonRepository</text>
  <text x="1185" y="781" text-anchor="middle" class="box-text">storage.py · JSON 存取</text>

  <rect x="1035" y="855" width="300" height="80" class="box" stroke="#a78bfa"/>
  <text x="1185" y="889" text-anchor="middle" class="box-title">Azure Blob Storage</text>
  <text x="1185" y="916" text-anchor="middle" class="box-text">每日內容快照</text>

  <path d="M990 640 C990 680 1060 680 1125 715" class="green-line"/>
  <path d="M1185 815 V855" class="green-line"/>

  <!-- Cross-lane storage write -->
  <path d="M735 587 C815 587 830 765 1035 765" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-blue)" stroke-dasharray="10 8"/>
  <text x="815" y="675" class="flow-label" fill="#7c3aed">儲存產生結果</text>

  <!-- Composition root connections -->
  <path d="M650 240 C610 275 590 315 590 365" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M950 240 C1040 280 1260 300 1355 365" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7"/>

  <!-- Shared models -->
  <rect x="615" y="875" width="310" height="60" rx="16" fill="#fff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="770" y="901" text-anchor="middle" class="box-title">models.py · prompts.py</text>
  <text x="770" y="924" text-anchor="middle" class="box-text">共用契約、驗證與提示詞</text>
</svg>
